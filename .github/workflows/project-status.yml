name: Project status sync

on:
  pull_request:
    types: [closed]

jobs:
  update-status:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues' project status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_ID: PVT_kwHOCu3BUc4BizfE
          STATUS_FIELD_ID: PVTSSF_lAHOCu3BUc4BizfEzhhqIo8
          ON_DEV_OPTION_ID: 6bb96028
          ON_MAIN_OPTION_ID: 38e6d858
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$BASE_REF" in
            dev) TARGET_OPTION_ID="$ON_DEV_OPTION_ID" ;;
            main) TARGET_OPTION_ID="$ON_MAIN_OPTION_ID" ;;
            *) echo "base ref '$BASE_REF' not tracked, skipping"; exit 0 ;;
          esac

          issue_numbers=$(gh api "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '.body' | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
            | grep -oE '[0-9]+' || true)

          if [ -z "$issue_numbers" ]; then
            echo "no linked issues found in PR body"
            exit 0
          fi

          for n in $issue_numbers; do
            issue_node_id=$(gh api "repos/$REPO/issues/$n" --jq '.node_id')

            item_id=$(gh api graphql -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes { id content { ... on Issue { id } } }
                    }
                  }
                }
              }' -f projectId="$PROJECT_ID" \
              --jq ".data.node.items.nodes[] | select(.content.id==\"$issue_node_id\") | .id")

            if [ -z "$item_id" ]; then
              echo "issue #$n not found on project, skipping"
              continue
            fi

            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }' -f projectId="$PROJECT_ID" -f itemId="$item_id" \
                 -f fieldId="$STATUS_FIELD_ID" -f optionId="$TARGET_OPTION_ID"

            echo "issue #$n -> $BASE_REF status"
          done
